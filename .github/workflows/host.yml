name: Host daemon and adapters
on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux USB dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config
      - name: macOS USB dependency
        if: runner.os == 'macOS'
        run: brew install libusb
      - run: cargo fmt --manifest-path ph-bridge/Cargo.toml --all --check
      - run: cargo fmt --manifest-path host/mcp/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path ph-bridge/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path host/mcp/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path ph-bridge/Cargo.toml --bins
      - run: cargo test --locked --manifest-path ph-bridge/Cargo.toml --workspace
      - run: cargo test --locked --manifest-path host/mcp/Cargo.toml
      - run: python -m pip install -r host/requirements.txt
      - run: python -m unittest discover -s host/tests -v
        env:
          PYTHONPATH: host
          PHD_HARDWARE_TEST: '0'
      - name: Desktop regression tests
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path desktop/Cargo.toml --workspace
