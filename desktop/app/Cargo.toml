[package]
name = "ph-app"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "ph-app"

[features]
ui-perf = []

[dependencies]
eframe = "0.31"
ph_app_link = { package = "ph-client", path = "../../ph-bridge/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["eframe"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
