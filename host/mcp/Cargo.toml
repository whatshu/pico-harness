[package]
name = "ph-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pico Harness MCP server backed exclusively by phd socket IPC"

[workspace]

[dependencies]
ph-client = { path = "../../ph-bridge/client" }
ph-protocol = { path = "../../ph-bridge/protocol" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
phd = { path = "../../ph-bridge/phd" }
