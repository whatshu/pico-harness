[workspace]
resolver = "2"
members = ["bridge", "image", "device", "protocol", "client", "phd", "phdcli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
