[package]
name = "ph-bridge"
version = "0.1.0"
edition = "2021"
description = "Pico Harness Bridge: PC <-> Debug core connectivity (PH protocol over CDC + bulk data plane)"
license = "MIT"

[lib]
name = "ph_bridge"
crate-type = ["rlib"]

[dependencies]
ph-protocol = { path = "../protocol" }
prost = "0.13"
thiserror = "1"
serialport = { version = "4.10", features = ["usbportinfo-interface"] }
rusb = "0.9"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
hex = "0.4"
tempfile = "3"
